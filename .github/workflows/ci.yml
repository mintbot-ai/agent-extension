name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (py${{ matrix.python }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        backend: [cryptography, openssl-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (with the cryptography wheel)
        if: matrix.backend == 'cryptography'
        run: pip install -e .[dev]
      - name: Install (openssl CLI backend only)
        if: matrix.backend == 'openssl-only'
        # No cryptography wheel: signing must work through the openssl binary
        # alone, which is what a host without a Python crypto stack has.
        run: |
          pip install -e . pytest jsonschema
          python -c "import importlib.util as u; assert u.find_spec('cryptography') is None"
          openssl version
      - name: Unit + conformance tests
        run: pytest -q tests/ conformance/
      - name: Worked example round-trips through the CLI
        run: |
          axp validate examples/sample-memory/agent-extension.json > /dev/null
          axp verify examples/sample-memory/agent-extension.json --keydir examples/sample-memory/agent-extension-keys.json
          axp target examples/sample-memory/agent-extension.json --runtime hermes --runtime posix --platform linux/amd64 --runtime-version hermes=0.20.0 > /dev/null
      - name: Commerce example round-trips through the CLI (SPEC 14)
        run: |
          axp validate examples/paid-tool/agent-extension.json > /dev/null
          axp verify examples/paid-tool/agent-extension.json --keydir examples/paid-tool/agent-extension-keys.json
          axp entitlement verify examples/paid-tool/entitlement.json --manifest examples/paid-tool/agent-extension.json --keydir examples/paid-tool/agent-extension-keys.json > /dev/null
          axp entitlement present examples/paid-tool/entitlement.json --host-key examples/paid-tool/example-host.key --audience https://ext.example.com/paid-tool-1.0.0.tar.gz --value-only > token
          axp entitlement inspect @token --audience https://ext.example.com/paid-tool-1.0.0.tar.gz --manifest examples/paid-tool/agent-extension.json --keydir examples/paid-tool/agent-extension-keys.json > /dev/null

  schema:
    name: schema validates the example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install jsonschema
      - run: |
          python - <<'PY'
          import json, jsonschema
          for schema, doc in (("schema/agent-extension.schema.json", "examples/sample-memory/agent-extension.json"),
                              ("schema/agent-extension-keys.schema.json", "examples/sample-memory/agent-extension-keys.json"),
                              ("schema/agent-extension.schema.json", "examples/paid-tool/agent-extension.json"),
                              ("schema/agent-extension-keys.schema.json", "examples/paid-tool/agent-extension-keys.json"),
                              ("schema/agent-extension-entitlement.schema.json", "examples/paid-tool/entitlement.json")):
              s = json.load(open(schema)); jsonschema.Draft202012Validator.check_schema(s)
              jsonschema.validate(json.load(open(doc)), s); print("ok", doc)
          PY
