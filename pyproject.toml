[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axp"
version = "0.5.0"
description = "Reference implementation of the Agent Extension Protocol (AXP): manifest validation, JCS canonicalization, ed25519 signing with TOFU pinning, and the axp CLI."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# Python 3.10 needs tomli for local project defaults; newer Python uses tomllib.
# Signing uses cryptography when available, otherwise the openssl CLI.
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
crypto = ["cryptography>=41"]
dev = ["pytest>=8", "cryptography>=41", "jsonschema>=4"]

[project.scripts]
axp = "axp.cli:main"

[tool.setuptools]
packages = ["axp"]

[tool.setuptools.package-data]
axp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance"]
